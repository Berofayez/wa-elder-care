<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Admin Login — WA Elder Care')}"></head>
<body>

<main class="container">
    <section class="card" style="max-width: 400px; margin: 60px auto;">
        <h1>Admin login</h1>

        <div class="error-message" th:if="${param.error}">
            Incorrect email or password.
        </div>
        <div class="flash-message" th:if="${param.loggedOut}">
            You've been logged out.
        </div>

        <form th:action="@{/admin/login}" method="post">
            <div class="field">
                <label for="username">Email</label>
                <input type="email" id="username" name="username" autofocus="autofocus"/>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"/>
            </div>
            <button type="submit" class="btn btn-primary">Log in</button>
        </form>
    </section>
</main>

</body>
</html>
